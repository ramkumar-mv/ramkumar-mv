<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Ramkumar M V: model training and GPU optimization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#132108"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#76b900" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9be22d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9ffa3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 800 52px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: url(#shine);
            opacity: 0; animation: rise 1.1s ease-out 0.2s forwards; }
    .tag  { font: 500 17px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #9be22d;
            opacity: 0; animation: rise 1.1s ease-out 0.9s forwards; }
    .dot  { fill: #9be22d; animation: blink 2.4s ease-in-out infinite; }
    .grid { stroke: #76b900; stroke-opacity: 0.07; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="210" fill="url(#bg)"/>
    <g class="grid">
      <path d="M0 42H900M0 84H900M0 126H900M0 168H900M150 0V210M300 0V210M450 0V210M600 0V210M750 0V210"/>
    </g>
    <path fill="url(#wave)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 160 Q225 130 450 160 T900 160 V210 H0Z;
                M0 165 Q225 195 450 165 T900 165 V210 H0Z;
                M0 160 Q225 130 450 160 T900 160 V210 H0Z"/>
    </path>
    <path fill="#76b900" fill-opacity="0.25">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M0 180 Q225 200 450 178 T900 182 V210 H0Z;
                M0 176 Q225 160 450 184 T900 176 V210 H0Z;
                M0 180 Q225 200 450 178 T900 182 V210 H0Z"/>
    </path>
    <circle class="dot" cx="64" cy="48" r="4"/>
    <circle class="dot" cx="836" cy="40" r="3" style="animation-delay:.8s"/>
    <circle class="dot" cx="790" cy="120" r="2.5" style="animation-delay:1.6s"/>
    <text class="name" x="450" y="98" text-anchor="middle">Ramkumar M V</text>
    <text class="tag" x="450" y="134" text-anchor="middle">model training · GPU optimization · fast inference</text>
  </g>
</svg>
